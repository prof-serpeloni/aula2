<!DOCTYPE html>
<html>
    <head>
        <title>Grid Layout</title>

        <style>
            #grid {
                display: grid;
                grid-template-columns: 3fr 100px 1fr;
                grid-template-rows: 100px 40px auto 100px;
                gap: 20px;
                grid-template-areas: 
                        "cabecalho cabecalho cabecalho"
                        "nav-p nav-p nav-p"
                        "content1 nav-s publi"
                        "rodape rodape rodape";
                min-height: 100vh;
            }

            header {
                border-width: 1px;
                border-style: solid;
                grid-area: cabecalho;
            }

            footer {
                border-width: 1px;
                border-style: solid;
                grid-area: rodape;
            }

            nav {
                border-style: solid;
                border-width: 1px;
            }

            #nav-principal {
                grid-area: nav-p;
            }

            #nav-principal ul {
                display: flex;
                flex-direction: row;
                list-style-type: none;
                gap: 10px;
            }

            div {
                border-style: solid;
                border-width: 1px;
            }

            #nav-secundario {
                grid-area: nav-s;
            }

            #conteudo {
                grid-area: content1;
            }

            #publicidade {
                grid-area: publi;
            }
        </style>

    </head>
    <body>
        <div id="grid">
            <header>
                <h1>Grid Layout</h1>
            </header>

            <nav id="nav-principal">
                <ul>
                    <li>Home</li>
                    <li>Contato</li>
                    <li>Cadastros</li>
                </ul>
            </nav>

            <nav id="nav-secundario">
                <ul>
                    <li>Novo</li>
                    <li>Editar</li>
                </ul>
            </nav>

            <div id="conteudo">
                <p>Nosso conteudo</p>
            </div>

            <div id="publicidade">
                <p>Publicidades</p>
            </div>
       
            <footer>
                <h2>Rodapé</h2>
            </footer>
        </div>
    </body>
</html>
